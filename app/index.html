<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agendamento Lumielle</title>
  <meta name="description" content="Formata os dados da cliente para o formulário da Logzz e confere a cobertura pelo CEP.">
  <meta name="theme-color" content="#4d2c12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <nav class="abas" aria-label="Telas">
      <a href="#agendamento" class="aba" data-tela="agendamento">Agendamento</a>
      <a href="#checkout" class="aba" data-tela="checkout">Check-out</a>
      <a href="#galeria" class="aba" data-tela="galeria">Galeria</a>
    </nav>
  </header>

  <main id="tela-agendamento" class="tela">
    <section class="cartao">
      <h2>Dados da cliente</h2>
      <label for="texto">Nome, CPF, telefone e CEP, em qualquer ordem</label>
      <textarea id="texto" rows="4"autocomplete="off" autocapitalize="off" spellcheck="false"
                placeholder="+55 21 98226-0000&#10;Fulano de Tal&#10;123.456.789-09&#10;20000-000"></textarea>
      <div class="acoes">
        <button type="button" class="botao claro" id="colar">Colar</button>
        <button type="button" class="botao cobre" id="formatar">Formatar</button>
        <button type="button" class="botao claro" id="limpar">Limpar</button>
      </div>
      <p class="pequeno nota">Uma cliente por vez. Fica só no celular até Limpar.</p>
    </section>

    <section class="cartao" id="resultado" hidden>
      <h2>Para o formulário da Logzz</h2>
      <dl class="ficha" id="campos"></dl>
      <p class="cobertura" id="cobertura"></p>
      <div id="obs"></div>
      <ul class="pequeno" id="avisos"></ul>
      <p class="pequeno" id="sobras"></p>
    </section>

    <section class="cartao">
      <h2>Anotações</h2>
      <label for="anotacoes">Kit, valor, dia da entrega, o que for</label>
      <textarea id="anotacoes" rows="5"></textarea>
      <div class="acoes"><button type="button" class="botao claro" id="apagar-anotacoes">Apagar anotações</button></div>
      <p class="pequeno nota">Fica só no celular até apagar.</p>
    </section>

    <p class="rodape" id="rodape"></p>
  </main>

  <main id="tela-checkout" class="tela" hidden>
    <div id="lista-checkout"></div>
    <p class="rodape rodape-dados"></p>
  </main>

  <main id="tela-galeria" class="tela" hidden>
    <div id="lista-galeria" class="galeria"></div>
    <p class="rodape rodape-dados"></p>
  </main>

  <script src="dados.js"></script>
  <script src="cobertura.js"></script>
  <script src="logica.js"></script>
  <script src="app.js"></script>
  <script src="telas.js"></script>
</body>
</html>
