<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agendamento Lumielle</title>
  <meta name="description" content="Formata os dados da cliente para o formulário da Logzz e confere a cobertura pelo CEP.">
  <meta name="theme-color" content="#4d2c12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <span class="marca">LUMI<span>ELLE</span></span>
    <span class="titulo-app">Agendamento</span>
  </header>

  <main>
    <section class="cartao">
      <h2>Dados da cliente</h2>
      <label for="texto">Cole aqui o que a cliente mandou (nome, CPF, telefone e CEP, em qualquer ordem)</label>
      <textarea id="texto" rows="6" autocomplete="off" autocapitalize="off" spellcheck="false"
                placeholder="+55 21 98226-0000&#10;Fulano de Tal&#10;123.456.789-09&#10;20000-000"></textarea>
      <div class="acoes">
        <button type="button" class="botao claro" id="colar">Colar</button>
        <button type="button" class="botao cobre" id="formatar">Formatar</button>
        <button type="button" class="botao claro" id="limpar">Limpar</button>
      </div>
      <p class="pequeno">Uma cliente de cada vez. Nada sai do celular: o que você colou fica guardado só neste
         aparelho, até tocar em Limpar.</p>
    </section>

    <section class="cartao" id="resultado" hidden>
      <h2>Para o formulário da Logzz</h2>
      <dl class="ficha" id="campos"></dl>
      <p class="cobertura" id="cobertura"></p>
      <div id="obs"></div>
      <ul class="pequeno" id="avisos"></ul>
      <p class="pequeno" id="sobras"></p>
    </section>

    <section class="cartao">
      <h2>Anotações</h2>
      <label for="anotacoes">Rascunho livre (kit, valor, dia da entrega, o que for)</label>
      <textarea id="anotacoes" rows="5"></textarea>
      <div class="acoes"><button type="button" class="botao claro" id="apagar-anotacoes">Apagar anotações</button></div>
      <p class="pequeno">Também fica guardado só neste aparelho, até apagar.</p>
    </section>

    <p class="rodape" id="rodape"></p>
  </main>

  <script src="cobertura.js"></script>
  <script src="logica.js"></script>
  <script src="app.js"></script>
</body>
</html>
